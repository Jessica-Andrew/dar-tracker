<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DAR Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --border: #E7E5E0;
    --border-strong: #D4D1CA;
    --text: #1C1C1A;
    --text-dim: #6B6862;
    --text-faint: #A19E96;
    --accent: #3B4CE0;
    --accent-dim: #EEF0FD;
    --accent-hover: #2E3CC4;
    --danger: #C24A3C;
    --danger-dim: #FBEEEC;
    --ok: #3E7A56;
    --ok-dim: #EAF4EE;
    --radius: 10px;
    --radius-sm: 6px;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background: var(--bg); font-family: var(--sans); color: var(--text); }
  ::selection{ background: var(--accent-dim); }

  #app{ max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }

  .top{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
  .top h1{ font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin:0 0 3px; }
  .top .sub{ font-size: 12.5px; color: var(--text-dim); }
  .date-nav{ display:flex; align-items:center; gap: 8px; }
  .date-nav button{ width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); cursor:pointer; font-size: 13px; display:flex; align-items:center; justify-content:center; }
  .date-nav button:hover{ border-color: var(--border-strong); color: var(--text); }
  .date-label{ font-size: 13px; font-weight: 600; min-width: 108px; text-align:center; }
  .date-label.today::after{ content: '· today'; font-weight: 400; color: var(--text-faint); }

  .totalbar{ display:flex; align-items:center; justify-content:space-between; background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 18px; }
  .totalbar .label{ font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
  .totalbar .value{ font-family: var(--mono); font-size: 20px; font-weight: 500; }
  .totalbar .value.over{ color: var(--ok); }
  .totalbar .value.under{ color: var(--text); }

  .card{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow:hidden; }

  .task{ padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .task:last-child{ border-bottom:none; }
  .task-head{ display:flex; justify-content:space-between; align-items:flex-start; gap: 10px; }
  .task-title{ font-size: 14px; font-weight: 600; }
  .task-title .id{ font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-dim); padding: 1px 6px; border-radius: 4px; margin-right: 7px; }
  .task-actions{ display:flex; gap:4px; flex-shrink:0; }
  .task-actions button{ border:none; background:none; color: var(--text-faint); cursor:pointer; font-size: 12px; padding: 3px 6px; border-radius: 5px; }
  .task-actions button:hover{ background: var(--bg); color: var(--text); }
  .task-actions button.del:hover{ background: var(--danger-dim); color: var(--danger); }
  .task-meta{ display:flex; flex-wrap:wrap; gap: 6px 16px; margin-top: 8px; font-size: 12.5px; color: var(--text-dim); }
  .task-meta span b{ color: var(--text); font-weight: 500; }
  .task-meta .blocker-flag{ color: var(--danger); font-weight: 500; }
  .task-meta a{ color: var(--accent); text-decoration: none; }
  .task-meta a:hover{ text-decoration: underline; }

  .empty{ padding: 34px 18px; text-align:center; color: var(--text-faint); font-size: 13px; }

  .addbtn{ width:100%; padding: 12px; border: 1px dashed var(--border-strong); border-radius: var(--radius); background: transparent; color: var(--text-dim); font-size: 13px; font-weight: 500; cursor:pointer; margin-bottom: 22px; }
  .addbtn:hover{ border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .form{ padding: 16px 18px 18px; }
  .form-row{ display:flex; gap: 10px; margin-bottom: 10px; }
  .form-row.full{ flex-direction: column; }
  .field{ flex:1; display:flex; flex-direction:column; gap:5px; min-width:0; }
  .field label{ font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
  .field input, .field textarea{
    font-family: var(--sans); font-size: 13.5px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text); outline:none; width:100%;
  }
  .field input:focus, .field textarea:focus{ border-color: var(--accent); background: var(--surface); }
  .field textarea{ resize: vertical; min-height: 40px; font-family: var(--sans); }
  .field.tiny{ flex: 0 0 90px; }
  .form-actions{ display:flex; gap: 8px; margin-top: 4px; }
  .btn{ font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; }
  .btn-primary{ background: var(--accent); color: white; }
  .btn-primary:hover{ background: var(--accent-hover); }
  .btn-ghost{ background: transparent; color: var(--text-dim); border-color: var(--border); }
  .btn-ghost:hover{ color: var(--text); border-color: var(--border-strong); }

  .section-label{ font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin: 30px 0 10px; display:flex; align-items:center; gap:8px; }
  .section-label::after{ content:''; flex:1; height:1px; background: var(--border); }

  .slack-preview{ background: #1A1D21; border-radius: var(--radius); padding: 16px 18px; }
  .slack-msg{ font-family: var(--mono); font-size: 12.5px; line-height: 1.65; color: #D1D2D3; white-space: pre-wrap; word-break: break-word; }
  .slack-msg .t1{ color: #FFFFFF; font-weight: 600; }
  .slack-msg .lbl{ color: #8B8E93; }
  .copybar{ display:flex; justify-content:space-between; align-items:center; margin-top: 12px; }
  .copybar .hint{ font-size: 11.5px; color: var(--text-faint); }
  .copybtn{ background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: var(--radius-sm); cursor:pointer; }
  .copybtn:hover{ border-color: var(--accent); color: var(--accent); }
  .copybtn.copied{ background: var(--ok-dim); border-color: var(--ok); color: var(--ok); }

  .toast{ position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: white; font-size: 12.5px; padding: 9px 16px; border-radius: 20px; opacity:0; pointer-events:none; transition: opacity .2s, transform .2s; }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(-6px); }

  .import-toggle{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; padding: 12px 16px; }
  .import-toggle .lbl{ font-size: 13px; font-weight: 600; display:flex; align-items:center; gap:8px; }
  .import-toggle .lbl .dot{ width:7px; height:7px; border-radius:50%; background: var(--accent); }
  .import-toggle .chev{ color: var(--text-faint); font-size: 12px; transition: transform .15s; }
  .import-toggle.open .chev{ transform: rotate(90deg); }
  .import-body{ padding: 0 16px 16px; }
  .tabs{ display:flex; gap: 4px; margin-bottom: 12px; background: var(--bg); border-radius: var(--radius-sm); padding: 3px; width: fit-content; }
  .tab{ font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 5px; cursor:pointer; color: var(--text-dim); border:none; background:none; }
  .tab.active{ background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .note{ font-size: 11.5px; color: var(--text-faint); line-height: 1.5; margin: 8px 0 12px; }
  .note a{ color: var(--accent); }
  .csv-area{ width:100%; min-height: 90px; font-family: var(--mono); font-size: 11.5px; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); resize: vertical; }
  .import-error{ font-size: 12px; color: var(--danger); background: var(--danger-dim); padding: 8px 10px; border-radius: var(--radius-sm); margin-top: 10px; }
  .entry-list{ margin-top: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow:hidden; }
  .entry-row{ display:flex; align-items:center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .entry-row:last-child{ border-bottom:none; }
  .entry-row input[type=checkbox]{ flex-shrink:0; }
  .entry-row .e-desc{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry-row .e-desc .proj{ color: var(--text-dim); }
  .entry-row .e-hours{ font-family: var(--mono); font-weight:500; flex-shrink:0; }
  .entry-list-actions{ display:flex; justify-content: space-between; align-items:center; padding: 10px 12px; background: var(--bg); }
  .entry-list-actions .sel-all{ font-size: 12px; color: var(--text-dim); display:flex; align-items:center; gap:6px; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div>
      <h1>Daily Activities Report</h1>
      <div class="sub">Log tasks as you go &middot; paste the formatted report into Slack</div>
    </div>
    <div class="date-nav">
      <button id="prevDay" title="Previous day">&larr;</button>
      <div class="date-label" id="dateLabel"></div>
      <button id="nextDay" title="Next day">&rarr;</button>
    </div>
  </div>

  <div class="totalbar">
    <div class="label">Total logged</div>
    <div class="value" id="totalValue">0h</div>
  </div>

  <div class="card" id="taskCard"></div>

  <button class="addbtn" id="addBtn">+ Add task</button>

  <div class="card">
    <div class="import-toggle" id="importToggle">
      <div class="lbl"><span class="dot"></span>Import from Clockify</div>
      <div class="chev">›</div>
    </div>
    <div class="import-body" id="importBody" style="display:none;"></div>
  </div>

  <div class="section-label">Slack message</div>
  <div class="slack-preview">
    <div class="slack-msg" id="slackMsg">Add a task to see the formatted report.</div>
  </div>
  <div class="copybar">
    <div class="hint">Matches the DAR format &middot; exact spacing preserved</div>
    <button class="copybtn" id="copyBtn">Copy report</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<template id="formTemplate">
  <div class="form">
    <div class="form-row">
      <div class="field" style="flex:2">
        <label>Task description</label>
        <input type="text" class="f-desc" placeholder="Redesign checkout widget states">
      </div>
      <div class="field tiny">
        <label>Hours</label>
        <input type="text" class="f-hours" placeholder="2.5" inputmode="decimal">
      </div>
      <div class="field tiny">
        <label>ID (optional)</label>
        <input type="text" class="f-id" placeholder="DS-014">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Links</label>
        <input type="text" class="f-links" placeholder="PR, Figma file, doc URL">
      </div>
      <div class="field">
        <label>Blockers</label>
        <input type="text" class="f-blockers" placeholder="None">
      </div>
    </div>
    <div class="form-row full">
      <div class="field">
        <label>Next steps</label>
        <input type="text" class="f-next" placeholder="Share with Jessica for review">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary f-save">Save task</button>
      <button class="btn btn-ghost f-cancel">Cancel</button>
    </div>
  </div>
</template>

<script>
(function(){
  // Self-hosted persistence shim — replaces Claude artifact's window.storage
  // with plain browser localStorage, since this file runs on its own domain.
  const storage = {
    async get(key){
      const v = localStorage.getItem(key);
      return v !== null ? { key, value: v } : null;
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return { key, value };
    }
  };

  const app = {
    date: todayKey(),
    tasks: [],
    formOpenFor: null, // null = closed, 'new' = new task, or task.id for editing
    clockify: {
      apiKey: '',
      userId: '',
      workspaceId: '',
      proxyUrl: '',
      tab: 'api', // 'api' | 'csv'
      loading: false,
      error: null,
      entries: [] // { key, checked, desc, project, hours }
    }
  };

  function todayKey(d){
    const dt = d || new Date();
    return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
  }
  function keyToDate(k){
    const [y,m,d] = k.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function fmtDateLabel(k){
    const d = keyToDate(k);
    return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  }
  function storageKey(k){ return 'dar:' + k; }
  function uid(){ return 't' + Date.now() + Math.random().toString(36).slice(2,7); }

  async function loadDay(k){
    try{
      const res = await storage.get(storageKey(k), false);
      app.tasks = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      app.tasks = [];
    }
    render();
  }

  async function saveDay(){
    try{
      await storage.set(storageKey(app.date), JSON.stringify(app.tasks), false);
    }catch(e){
      showToast('Could not save — check connection');
    }
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 1800);
  }

  function parseHours(v){
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  function hoursToSeconds(v){
    const n = parseFloat(v);
    return isNaN(n) ? 0 : Math.round(n * 3600);
  }

  function formatDuration(totalSeconds){
    let s = Math.max(0, Math.round(totalSeconds));
    let h = Math.floor(s / 3600);
    let remSec = s % 3600;
    let m = Math.round(remSec / 60); // >=30s rounds up to the next minute
    if(m === 60){ h += 1; m = 0; }
    if(h > 0 && m > 0) return `${h}h ${m}m`;
    if(h > 0) return `${h}h`;
    return `${m}m`;
  }

  function totalDurationSeconds(){
    return app.tasks.reduce((sum,t)=> sum + hoursToSeconds(t.hours), 0);
  }

  function totalHours(){
    return app.tasks.reduce((sum,t)=> sum + parseHours(t.hours), 0);
  }

  function buildSlackText(){
    if(app.tasks.length === 0) return '';
    const lines = [];
    app.tasks.forEach((t, i)=>{
      const label = t.id ? `${t.id}: ${t.desc || '(untitled)'}` : (t.desc || '(untitled)');
      lines.push(`Task ${i+1}: ${label}`);
      lines.push(`- time spent: ${formatDuration(hoursToSeconds(t.hours))}`);
      lines.push(`- Links: ${t.links || 'None'}`);
      lines.push(`- blockers: ${t.blockers || 'None'}`);
      lines.push(`- next steps: ${t.next || 'None'}`);
    });
    lines.push(`Total hours: ${formatDuration(totalDurationSeconds())}`);
    return lines.join('\n');
  }

  function escapeHtml(s){
    return (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  function renderSlackPreview(){
    const el = document.getElementById('slackMsg');
    if(app.tasks.length === 0){
      el.textContent = 'Add a task to see the formatted report.';
      return;
    }
    let html = '';
    app.tasks.forEach((t,i)=>{
      const label = t.id ? `${escapeHtml(t.id)}: ${escapeHtml(t.desc||'(untitled)')}` : escapeHtml(t.desc||'(untitled)');
      html += `<span class="t1">Task ${i+1}: ${label}</span>\n`;
      html += `<span class="lbl">- time spent:</span> ${formatDuration(hoursToSeconds(t.hours))}\n`;
      html += `<span class="lbl">- Links:</span> ${escapeHtml(t.links||'None')}\n`;
      html += `<span class="lbl">- blockers:</span> ${escapeHtml(t.blockers||'None')}\n`;
      html += `<span class="lbl">- next steps:</span> ${escapeHtml(t.next||'None')}\n`;
    });
    html += `<span class="t1">Total hours: ${formatDuration(totalDurationSeconds())}</span>`;
    el.innerHTML = html;
  }

  function render(){
    document.getElementById('dateLabel').textContent = fmtDateLabel(app.date);
    document.getElementById('dateLabel').classList.toggle('today', app.date === todayKey());

    const totalSecs = totalDurationSeconds();
    const totalEl = document.getElementById('totalValue');
    totalEl.textContent = formatDuration(totalSecs);
    totalEl.className = 'value ' + (totalSecs >= 8*3600 ? 'over' : 'under');

    const card = document.getElementById('taskCard');
    card.innerHTML = '';

    if(app.tasks.length === 0 && app.formOpenFor !== 'new'){
      card.innerHTML = '<div class="empty">No tasks logged for this day yet.</div>';
    } else {
      app.tasks.forEach((t, i)=>{
        if(app.formOpenFor === t._key){
          card.appendChild(buildForm(t));
        } else {
          card.appendChild(buildTaskRow(t, i));
        }
      });
    }

    if(app.formOpenFor === 'new'){
      card.appendChild(buildForm(null));
    }

    document.getElementById('addBtn').style.display = app.formOpenFor ? 'none' : 'block';

    renderSlackPreview();
  }

  function buildTaskRow(t, index){
    const div = document.createElement('div');
    div.className = 'task';
    const hasBlocker = t.blockers && t.blockers.trim().toLowerCase() !== 'none' && t.blockers.trim() !== '';
    div.innerHTML = `
      <div class="task-head">
        <div class="task-title">${t.id ? `<span class="id">${escapeHtml(t.id)}</span>` : ''}${escapeHtml(t.desc || '(untitled)')}</div>
        <div class="task-actions">
          <button class="edit">Edit</button>
          <button class="del">Delete</button>
        </div>
      </div>
      <div class="task-meta">
        <span><b>${formatDuration(hoursToSeconds(t.hours))}</b></span>
        ${t.links ? `<span>${escapeHtml(t.links)}</span>` : ''}
        <span class="${hasBlocker ? 'blocker-flag' : ''}">${hasBlocker ? '⚠ ' + escapeHtml(t.blockers) : 'No blockers'}</span>
        ${t.next ? `<span>Next: ${escapeHtml(t.next)}</span>` : ''}
      </div>
    `;
    div.querySelector('.edit').addEventListener('click', ()=>{
      app.formOpenFor = t._key;
      render();
    });
    div.querySelector('.del').addEventListener('click', ()=>{
      app.tasks = app.tasks.filter(x => x._key !== t._key);
      saveDay();
      render();
    });
    return div;
  }

  function buildForm(existing){
    const tpl = document.getElementById('formTemplate').content.cloneNode(true);
    const wrap = document.createElement('div');
    wrap.appendChild(tpl);

    const descI = wrap.querySelector('.f-desc');
    const hoursI = wrap.querySelector('.f-hours');
    const idI = wrap.querySelector('.f-id');
    const linksI = wrap.querySelector('.f-links');
    const blockersI = wrap.querySelector('.f-blockers');
    const nextI = wrap.querySelector('.f-next');

    if(existing){
      descI.value = existing.desc || '';
      hoursI.value = existing.hours ? String(parseFloat(existing.hours)) : '';
      idI.value = existing.id || '';
      linksI.value = existing.links || '';
      blockersI.value = existing.blockers || '';
      nextI.value = existing.next || '';
    }

    wrap.querySelector('.f-save').addEventListener('click', ()=>{
      const fields = {
        taskLabel: idI.value.trim(),
        desc: descI.value.trim(),
        hours: hoursI.value.trim(),
        links: linksI.value.trim(),
        blockers: blockersI.value.trim(),
        next: nextI.value.trim()
      };
      if(!fields.desc){
        descI.style.borderColor = 'var(--danger)';
        descI.focus();
        return;
      }
      if(existing){
        const idx = app.tasks.findIndex(t => t._key === existing._key);
        app.tasks[idx] = Object.assign({}, existing, fields, { id: fields.taskLabel });
      } else {
        app.tasks.push(Object.assign({ _key: uid(), id: fields.taskLabel }, fields));
      }
      app.formOpenFor = null;
      saveDay();
      render();
    });

    wrap.querySelector('.f-cancel').addEventListener('click', ()=>{
      app.formOpenFor = null;
      render();
    });

    setTimeout(()=> descI.focus(), 30);

    return wrap.firstElementChild || wrap;
  }

  // ---------- Clockify import ----------

  async function loadClockifyConfig(){
    try{
      const res = await storage.get('clockify:config', false);
      if(res && res.value){
        const cfg = JSON.parse(res.value);
        app.clockify.apiKey = cfg.apiKey || '';
        app.clockify.userId = cfg.userId || '';
        app.clockify.workspaceId = cfg.workspaceId || '';
        app.clockify.proxyUrl = cfg.proxyUrl || '';
      }
    }catch(e){ /* no config saved yet */ }
  }

  async function saveClockifyConfig(){
    try{
      await storage.set('clockify:config', JSON.stringify({
        apiKey: app.clockify.apiKey,
        userId: app.clockify.userId,
        workspaceId: app.clockify.workspaceId,
        proxyUrl: app.clockify.proxyUrl
      }), false);
    }catch(e){ /* non-fatal */ }
  }

  function isoDurationToHours(iso){
    return isoDurationToSeconds(iso) / 3600;
  }

  function isoDurationToSeconds(iso){
    if(!iso) return 0;
    const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    if(!m) return 0;
    const h = parseInt(m[1]||0,10), min = parseInt(m[2]||0,10), s = parseInt(m[3]||0,10);
    return h*3600 + min*60 + s;
  }

  function dayRangeISO(dateKey){
    const d = keyToDate(dateKey);
    const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0);
    const end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59);
    return { start: start.toISOString(), end: end.toISOString() };
  }

  async function fetchClockifyEntries(){
    const c = app.clockify;
    if(!c.apiKey){
      c.error = 'Paste your Clockify API key first (Profile settings → API key, in Clockify).';
      renderImportPanel();
      return;
    }
    c.loading = true; c.error = null;
    renderImportPanel();
    try{
      const headers = { 'X-Api-Key': c.apiKey, 'Content-Type': 'application/json' };
      const base = c.proxyUrl
        ? c.proxyUrl.replace(/\/$/, '') + '/v1'
        : 'https://api.clockify.me/api/v1';

      if(!c.userId || !c.workspaceId){
        let userRes;
        try{
          userRes = await fetch(`${base}/user`, { headers });
        }catch(networkErr){
          throw { kind: 'network', detail: networkErr.message };
        }
        if(!userRes.ok){
          const body = await userRes.text().catch(()=> '');
          throw { kind: 'http', status: userRes.status, detail: body.slice(0,200) };
        }
        const user = await userRes.json();
        c.userId = user.id;
        c.workspaceId = user.defaultWorkspace;
      }

      const { start, end } = dayRangeISO(app.date);
      const url = `${base}/workspaces/${c.workspaceId}/user/${c.userId}/time-entries?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}&hydrated=true&page-size=200`;
      let entRes;
      try{
        entRes = await fetch(url, { headers });
      }catch(networkErr){
        throw { kind: 'network', detail: networkErr.message };
      }
      if(!entRes.ok){
        const body = await entRes.text().catch(()=> '');
        throw { kind: 'http', status: entRes.status, detail: body.slice(0,200) };
      }
      const raw = await entRes.json();

      c.entries = raw
        .filter(e => e.timeInterval && e.timeInterval.duration) // skip still-running entries
        .map(e => ({
          key: e.id,
          checked: true,
          desc: e.description || '(no description)',
          project: e.project ? e.project.name : '',
          seconds: isoDurationToSeconds(e.timeInterval.duration),
          hours: (isoDurationToSeconds(e.timeInterval.duration) / 3600).toFixed(4)
        }));

      await saveClockifyConfig();
      c.loading = false;
      renderImportPanel();
    }catch(err){
      c.loading = false;
      if(err && err.kind === 'network'){
        c.error = c.proxyUrl
          ? `Blocked before reaching your proxy (browser error: "${err.detail}"). Double-check the worker URL is correct and was deployed successfully — visiting it directly in a new tab should show some response rather than an error page.`
          : `Blocked before reaching Clockify (browser error: "${err.detail}"). This is what a CORS block or an ad-blocker/privacy extension both look like from here — try disabling any content/ad blocker for this page first, then retry. If it still fails, it's genuinely CORS — paste your deployed proxy's URL into the field above to route around it. Meanwhile, use the CSV tab below.`;
      } else if(err && err.kind === 'http'){
        if(err.status === 401 || err.status === 403){
          c.error = `Clockify rejected the API key (status ${err.status}). This got past CORS fine — double-check the key was copied correctly from Profile settings → API in Clockify.`;
        } else {
          c.error = `Clockify returned an error (status ${err.status}): ${err.detail || 'no details'}. This wasn't a CORS block — the request reached their server.`;
        }
      } else {
        c.error = `Unexpected error: ${err && err.message ? err.message : String(err)}. Try the CSV tab below as a fallback.`;
      }
      renderImportPanel();
    }
  }

  function parseCSVLine(line){
    const out = [];
    let cur = '', inQuotes = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(inQuotes){
        if(ch === '"' && line[i+1] === '"'){ cur += '"'; i++; }
        else if(ch === '"'){ inQuotes = false; }
        else cur += ch;
      } else {
        if(ch === '"') inQuotes = true;
        else if(ch === ','){ out.push(cur); cur = ''; }
        else cur += ch;
      }
    }
    out.push(cur);
    return out;
  }

  function parseClockifyCSV(text){
    const lines = text.split(/\r?\n/).filter(l => l.trim().length);
    if(lines.length < 2) return [];
    const header = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
    const descIdx = header.indexOf('description');
    const projIdx = header.indexOf('project');
    let hoursIdx = header.indexOf('duration (decimal)');
    if(hoursIdx === -1) hoursIdx = header.indexOf('duration (h)');
    if(hoursIdx === -1) hoursIdx = header.indexOf('duration');

    const rows = [];
    for(let i=1;i<lines.length;i++){
      const cols = parseCSVLine(lines[i]);
      if(cols.length < 2) continue;
      let seconds = 0;
      const rawHours = hoursIdx !== -1 ? cols[hoursIdx] : '';
      if(/^\d+:\d{2}:\d{2}$/.test(rawHours.trim())){
        const [h,m,s] = rawHours.trim().split(':').map(Number);
        seconds = h*3600 + m*60 + s;
      } else {
        seconds = Math.round((parseFloat(rawHours) || 0) * 3600);
      }
      rows.push({
        key: 'csv' + i,
        checked: true,
        desc: (descIdx !== -1 ? cols[descIdx] : '').trim() || '(no description)',
        project: (projIdx !== -1 ? cols[projIdx] : '').trim(),
        seconds,
        hours: (seconds / 3600).toFixed(4)
      });
    }
    return rows;
  }

  function importSelectedEntries(){
    const selected = app.clockify.entries.filter(e => e.checked);
    if(selected.length === 0){ showToast('Select at least one entry'); return; }
    selected.forEach(e => {
      app.tasks.push({
        _key: uid(),
        id: '',
        desc: e.project ? `${e.project} — ${e.desc}` : e.desc,
        hours: String(e.hours),
        links: '',
        blockers: '',
        next: ''
      });
    });
    const selectedKeys = new Set(selected.map(e => e.key));
    app.clockify.entries = app.clockify.entries.filter(e => !selectedKeys.has(e.key));
    saveDay();
    showToast(`Imported ${selected.length} task${selected.length > 1 ? 's' : ''} from Clockify`);
    render();
    renderImportPanel();
  }

  function mergeSelectedEntries(){
    const selected = app.clockify.entries.filter(e => e.checked);
    if(selected.length === 0){ showToast('Check at least one entry to merge'); return; }
    const name = window.prompt('Name for the combined task:', 'Meetings');
    if(name === null) return; // cancelled
    const finalName = name.trim() || 'Meetings';
    const totalSecs = selected.reduce((sum, e) => sum + (e.seconds != null ? e.seconds : hoursToSeconds(e.hours)), 0);
    app.tasks.push({
      _key: uid(),
      id: '',
      desc: finalName,
      hours: (totalSecs / 3600).toFixed(4),
      links: '',
      blockers: '',
      next: ''
    });
    const selectedKeys = new Set(selected.map(e => e.key));
    app.clockify.entries = app.clockify.entries.filter(e => !selectedKeys.has(e.key));
    saveDay();
    showToast(`Merged ${selected.length} entries into "${finalName}"`);
    render();
    renderImportPanel();
  }

  function renderImportPanel(){
    const body = document.getElementById('importBody');
    if(!body) return;
    const c = app.clockify;

    let entriesHtml = '';
    if(c.entries.length){
      const allChecked = c.entries.every(e => e.checked);
      entriesHtml = `
        <div class="entry-list">
          <div class="entry-list-actions">
            <label class="sel-all"><input type="checkbox" id="selAll" ${allChecked ? 'checked' : ''}> Select all</label>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-ghost" id="mergeBtn" style="padding:5px 12px; font-size:12px;">Merge checked → 1 task</button>
              <button class="btn btn-primary" id="importBtn" style="padding:5px 12px; font-size:12px;">Import selected</button>
            </div>
          </div>
          ${c.entries.map(e => `
            <div class="entry-row">
              <input type="checkbox" class="e-check" data-key="${e.key}" ${e.checked ? 'checked' : ''}>
              <div class="e-desc">${e.project ? `<span class="proj">${escapeHtml(e.project)} —</span> ` : ''}${escapeHtml(e.desc)}</div>
              <div class="e-hours">${formatDuration(e.seconds != null ? e.seconds : hoursToSeconds(e.hours))}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    body.innerHTML = `
      <div class="tabs">
        <button class="tab ${c.tab === 'api' ? 'active' : ''}" id="tabApi">API key</button>
        <button class="tab ${c.tab === 'csv' ? 'active' : ''}" id="tabCsv">Paste CSV</button>
      </div>
      ${c.tab === 'api' ? `
        <div class="form-row">
          <div class="field">
            <label>Clockify API key</label>
            <input type="password" id="apiKeyInput" placeholder="Paste your API key" value="${escapeHtml(c.apiKey)}">
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Proxy URL (optional — fixes CORS)</label>
            <input type="text" id="proxyUrlInput" placeholder="https://your-worker.workers.dev" value="${escapeHtml(c.proxyUrl)}">
          </div>
        </div>
        <div class="note">Find the API key in Clockify under Profile settings → API. If direct fetches get blocked by CORS, paste your deployed proxy's URL above and requests will route through it instead. Stored only in your own browser storage. Pulls entries for <b>${fmtDateLabel(app.date)}</b> — use the date arrows above to fetch a different day.</div>
        <button class="btn btn-primary" id="fetchBtn" ${c.loading ? 'disabled' : ''}>${c.loading ? 'Fetching…' : 'Fetch entries'}</button>
      ` : `
        <div class="note">In Clockify: Reports → Detailed → filter to <b>${fmtDateLabel(app.date)}</b> → Export → CSV. Open the file and paste its contents below.</div>
        <textarea class="csv-area" id="csvInput" placeholder="Paste CSV contents here"></textarea>
        <div style="margin-top:10px;">
          <button class="btn btn-primary" id="parseCsvBtn">Parse CSV</button>
        </div>
      `}
      ${c.error ? `<div class="import-error">${escapeHtml(c.error)}</div>` : ''}
      ${entriesHtml}
    `;

    document.getElementById('tabApi').addEventListener('click', ()=>{ c.tab = 'api'; c.error = null; renderImportPanel(); });
    document.getElementById('tabCsv').addEventListener('click', ()=>{ c.tab = 'csv'; c.error = null; renderImportPanel(); });

    if(c.tab === 'api'){
      const keyInput = document.getElementById('apiKeyInput');
      const proxyInput = document.getElementById('proxyUrlInput');
      keyInput.addEventListener('change', ()=>{ c.apiKey = keyInput.value.trim(); });
      proxyInput.addEventListener('change', ()=>{ c.proxyUrl = proxyInput.value.trim(); });
      document.getElementById('fetchBtn').addEventListener('click', ()=>{
        c.apiKey = keyInput.value.trim();
        c.proxyUrl = proxyInput.value.trim();
        fetchClockifyEntries();
      });
    } else {
      document.getElementById('parseCsvBtn').addEventListener('click', ()=>{
        const text = document.getElementById('csvInput').value;
        const rows = parseClockifyCSV(text);
        if(rows.length === 0){
          c.error = "Couldn't find any rows to import — check the CSV was exported from Clockify's Detailed report.";
        } else {
          c.error = null;
          c.entries = rows;
        }
        renderImportPanel();
      });
    }

    if(c.entries.length){
      document.getElementById('selAll').addEventListener('change', (ev)=>{
        c.entries.forEach(e => e.checked = ev.target.checked);
        renderImportPanel();
      });
      body.querySelectorAll('.e-check').forEach(cb => {
        cb.addEventListener('change', ()=>{
          const entry = c.entries.find(e => e.key === cb.dataset.key);
          if(entry) entry.checked = cb.checked;
        });
      });
      document.getElementById('importBtn').addEventListener('click', importSelectedEntries);
      document.getElementById('mergeBtn').addEventListener('click', mergeSelectedEntries);
    }
  }

  document.getElementById('importToggle').addEventListener('click', function(){
    const body = document.getElementById('importBody');
    const isOpen = body.style.display !== 'none';
    body.style.display = isOpen ? 'none' : 'block';
    this.classList.toggle('open', !isOpen);
    if(!isOpen) renderImportPanel();
  });

  document.getElementById('addBtn').addEventListener('click', ()=>{
    app.formOpenFor = 'new';
    render();
  });

  document.getElementById('prevDay').addEventListener('click', ()=>{
    const d = keyToDate(app.date);
    d.setDate(d.getDate()-1);
    app.date = todayKey(d);
    app.formOpenFor = null;
    loadDay(app.date);
  });
  document.getElementById('nextDay').addEventListener('click', ()=>{
    const d = keyToDate(app.date);
    d.setDate(d.getDate()+1);
    app.date = todayKey(d);
    app.formOpenFor = null;
    loadDay(app.date);
  });

  document.getElementById('copyBtn').addEventListener('click', async ()=>{
    const text = buildSlackText();
    if(!text){ showToast('Add at least one task first'); return; }
    try{
      await navigator.clipboard.writeText(text);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied ✓';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = 'Copy report'; btn.classList.remove('copied'); }, 1600);
  });

  loadClockifyConfig();
  loadDay(app.date);
})();
</script>
</body>
